[seed]
value = 42

[data]
train = "data/processed/train/triples.jsonl"
val   = "data/processed/val/triples.jsonl"
test  = "data/processed/test/triples.jsonl"

[core]
dim = 48
mlp = true
hidden = 64

[loss]
align_weight = 1.0
agree_weight = 0.2
center_weight = 0.1
temperature   = 0.07

[train]
epochs = 3
steps_per_epoch = 200
batch_size = 8
lr = 0.02
momentum = 0.9
log_every = 25
eval_every = 100
checkpoint_every = 200

[schedule]
lr_milestones = [200, 400]
lr_gamma = 0.7
temp_milestones = [200, 400]
temp_gamma = 0.95
cosine_lr = true
lr_min = 0.008
cosine_temp = true
temp_min = 0.05

[augment]
enable = true
size = 28
size_jitter = 2
padding = 2
stroke_width = 1
noise = 0.02
shift = 2
crop = 1

[fonts]
cycle = true
weights = []
