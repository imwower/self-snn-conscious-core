[seed]
value = 42

[data]
train = "data/processed/train/triples.jsonl"
val   = "data/processed/val/triples.jsonl"
test  = "data/processed/test/triples.jsonl"

[core]
dim = 48

[loss]
align_weight = 1.0
agree_weight = 0.2
center_weight = 0.1
temperature   = 0.07

[train]
epochs = 3
steps_per_epoch = 200
batch_size = 8
lr = 0.02
momentum = 0.9
log_every = 25
eval_every = 100
checkpoint_every = 200

