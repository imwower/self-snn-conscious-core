[seed]
value = 42

[data]
train = "data/processed/train/triples.jsonl"
val   = "data/processed/val/triples.jsonl"
test  = "data/processed/test/triples.jsonl"

[core]
dim = 48
mlp = false
hidden = 64

[loss]
align_weight = 1.0
agree_weight = 0.2
center_weight = 0.1
temperature   = 0.07

[train]
epochs = 1
steps_per_epoch = 80
batch_size = 8
lr = 0.02
momentum = 0.9
log_every = 10
eval_every = 40
checkpoint_every = 80

[schedule]
# 可选：里程碑步数触发调整；默认不生效（列表为空）
lr_milestones = []
lr_gamma = 0.5
temp_milestones = []
temp_gamma = 0.9
# 余弦退火：若开启则优先于里程碑调度
cosine_lr = false
lr_min = 0.005
cosine_temp = false
temp_min = 0.05

[augment]
enable = false
size = 28
size_jitter = 2
padding = 2
stroke_width = 1
noise = 0.0
shift = 0
crop = 0

[fonts]
cycle = false
weights = []
