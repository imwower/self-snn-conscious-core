[seed]
value = 42

[data]
train = "data/processed/train/triples.jsonl"
val   = "data/processed/val/triples.jsonl"
test  = "data/processed/test/triples.jsonl"

[image]
width = 64
height = 64

[encoding]
text_encoding   = "ttfs"      # or "rate"
vision_encoding = "rate"

[core]
dim = 48
prototypes = 32
wta_inhibition = 0.5
recurrent_steps = 1

[loss]
align_weight = 1.0            # zh-img, en-img
agree_weight = 0.2            # zh-en
center_weight = 0.1
sparse_weight = 0.02
rate_weight   = 0.02
temperature   = 0.07

[train]
epochs = 1
steps_per_epoch = 80
batch_size = 8
lr = 0.02
momentum = 0.9
log_every = 10
eval_every = 40
checkpoint_every = 80

